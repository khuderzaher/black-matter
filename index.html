<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Black Matter — a luminous, spatial particle universe shaped by human hands." />
    <title>BLACK MATTER — A Spatial Experience</title>
  </head>
  <body>
    <main id="experience" aria-label="Black Matter immersive particle environment">
      <canvas id="field" aria-label="A luminous three-dimensional particle universe"></canvas>
      <header class="masthead" aria-hidden="true">
        <span class="wordmark">BLACK MATTER</span>
        <span class="edition">SPATIAL STUDY <i>002</i></span>
      </header>

      <section class="intro" id="intro" aria-live="polite">
        <p class="eyebrow">A SPATIAL INTERACTIVE ENVIRONMENT</p>
        <h1>Feel the universe<span>.</span></h1>
        <p class="intro-copy">A living field of light, depth, and human motion.</p>
        <div class="intro-actions">
          <button class="button button-primary" id="enter-button" type="button">ENTER THE FIELD <span aria-hidden="true">↗</span></button>
          <button class="text-button" id="camera-button" type="button">ENABLE SPATIAL HAND TRACKING</button>
        </div>
        <p class="permission-note" id="permission-note">Camera access is optional. Up to two hands are processed locally in your browser.</p>
      </section>

      <div class="camera-state" id="camera-state" aria-live="polite">
        <span class="state-dot"></span>
        <span id="camera-label">POINTER FIELD</span>
      </div>

      <button class="exit-button" id="exit-button" type="button" aria-label="Exit immersive experience">＋</button>
      <video id="camera-video" playsinline muted aria-hidden="true"></video>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
