<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Black Matter — an immersive, hand-responsive particle environment." />
    <title>BLACK MATTER — Interactive Field</title>
  </head>
  <body>
    <main id="experience" aria-label="Black Matter interactive particle experience">
      <canvas id="field" aria-label="A three-dimensional field of moving particles"></canvas>

      <header class="masthead" aria-hidden="true">
        <span class="wordmark">BLACK MATTER</span>
        <span class="edition">FIELD STUDY <i>001</i></span>
      </header>

      <section class="intro" id="intro" aria-live="polite">
        <p class="eyebrow">AN INTERACTIVE ENVIRONMENT</p>
        <h1>Enter the field<span>.</span></h1>
        <p class="intro-copy">A living system of light, depth, and motion.</p>
        <div class="intro-actions">
          <button class="button button-primary" id="enter-button" type="button">ENTER EXPERIENCE <span aria-hidden="true">↗</span></button>
          <button class="text-button" id="camera-button" type="button">ENABLE HAND TRACKING</button>
        </div>
        <p class="permission-note" id="permission-note">Camera access is optional. Video is processed locally in your browser.</p>
      </section>

      <div class="camera-state" id="camera-state" aria-live="polite">
        <span class="state-dot"></span>
        <span id="camera-label">POINTER FIELD</span>
      </div>

      <button class="exit-button" id="exit-button" type="button" aria-label="Show experience controls">＋</button>
      <video id="camera-video" playsinline muted aria-hidden="true"></video>
      <div class="vignette" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
